    <path d="M 333 294.5 C 333 291.8 335.5 291.2 337 292.8 C 338.5 294.8 337.5 298 335 298 C 332.5 298 333 293.8 335.5 292.2 C 337 291.2 338.5 291.8 338.5 294.5 C 338 299.5 337.5 304.5 336.5 307.5 C 335 310.5 331.8 310 331.2 307.8 C 330.8 305.8 333 304.2 336 303.8 C 338.5 303.2 340.5 302.8 342.5 301"
