    <path d="M 285 296.5 C 286.8 292 288 290 289.5 290 C 291 290 290 295 287.5 308.5 M 287.5 296 C 290 291.5 293.5 291 294.5 294.5 C 295 297.5 292.5 299.5 289.5 299.5 C 291.5 299.5 293.5 298.5 295.5 296.5"
          fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'o' -->
    <path d="M 296.5 295 C 296.5 291.5 299.5 290 301.5 292 C 303.5 294 303 298.5 300 298.5 C 297 298.5 296.8 294.5 299.5 292 C 301.5 290.5 303.5 291 305.5 293"
          fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'r' -->
    <path d="M 305.5 294.5 C 306 291.5 307.8 290.5 309.8 290.5 C 311.2 290.5 311.8 291.5 312.2 294 C 312 296.5 312 298.5 314.2 296.5"
